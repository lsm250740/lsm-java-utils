import java.text.SimpleDateFormat;


def buildTime() {
	def df = new SimpleDateFormat("yyyy-MMMMM-dd HH:mm:ss")
	return df.format(new Date())
}
def nameConvert(string) {
	string = string.replaceAll('(?<!^)([a-z])([A-Z])', '$1-$2').toLowerCase();
	println 'converted: ' + string;
	return string;
}

