/******************************************************************************************
 *  TOML libs definitons utilities
 *  - getTomlCatalog - returns Toml catalog  VersionCatalogsExtension (@see settings.gradle)
 *  - getTomlLibVersion - returns value of the lib defined in TOML section  named [version]
 * -  tomlDependecies - adds dependecies to DependencyHandler 
 *                          it should be sent to the method - variable name is delegate
 *  -  tomlDependecies - calls   tomlDependecies with parameter isTest = true                   
 *  - catalog - collection of TOML defined configuration
 *  - tomlFindLibs - find all libs aliases in TOML catalog starting with a prefix
 *  - tomlFindLibsBundles - find all bundles aliases in TOML catalog starting with a prefix
 *******************************************************************************************/

def getTomlCatalog() {
	if (!project.hasProperty('catalog')) {
		if (project.extensions.findByType(VersionCatalogsExtension)) {
			project.ext.catalog = project.extensions.getByType(VersionCatalogsExtension).named("libs")
		} else {
			throw new GradleException("VersionCatalogsExtension not found — make sure it's available and you inthe proper section ")
		}
	}
	return project.ext.catalog
}

def getTomlLibVersion(String lib, defaultValue=null) {
	def libs = getTomlCatalog()
    return libs.findVersion(lib).map {it.requiredVersion }.orElse(defaultValue)
}

def tomlFindLib(String prefix) {
	def catalog = getTomlCatalog()
	def result = [:] // Map<String, Object>
	catalog.libraryAliases.each { alias ->
		if (alias.startsWith(prefix)) {
			result[alias]=catalog.findLibrary(alias).get()
		}
	}
	return result
}

// Find all bundle aliases starting with a prefix
def tomlFindLibsBundles(String prefix,bundlesOnly=false) {
	def catalog = getTomlCatalog()
	def result = [:] // Map<String, Object>
	catalog.bundleAliases.each { alias ->
		if (alias.startsWith(prefix)) {
			result[alias]=catalog.findBundle(alias).get()
		}
	}

	// Check if result is empty
	if (result.isEmpty()) {
		println "Warning: No bundles found with prefix '$prefix'"
		if (!bundlesOnly) {
			result = tomlFindLib(prefix)
		}
	}

	return result
}

/******************************************************************************************
 *  TOML libs definitons utilities
 * -  tomlDependecies - adds TEst dependecies to DependencyHandler
 *                          it should be sent to the method - variable name is delegate
 *  -  tomlDependecies - calls   tomlDependecies with parameter isTest = true
 *******************************************************************************************/

def tomlAddTestDependencies(source,String prefix) {
	tomlTestDependecies(source,prefix,true)
}

/******************************************************************************************
 *  TOML libs definitons utilities
 * -  tomlDependecies - adds dependecies to DependencyHandler
 *                          it should be sent to the method - variable name is delegate
 *  -  tomlDependecies - calls   tomlDependecies with parameter isTest = true
 *******************************************************************************************/

def tomlTestDependecies(source , String inLibName, boolean isTest = false) {
	tomlFindLibsBundles(inLibName).each { libName, depProvider ->

		def config =libName.endsWith('RuntimeOnly') ? 'runtimeOnly' :
				libName.endsWith('compileOnly') ? 'compileOnly' :
				'implementation'
		config = config = isTest ? "test${config.capitalize()}" : config
		println "[DEBUG] Adding $libName as $config"

		def deps = depProvider.get()
		if (deps instanceof Collection) {
			deps.each { singleDep ->
				source.add(config, singleDep)
			}
		} else {
			source.add(config, deps)
		}
	}
}



/************************************************************************************
 *
 * Set nested property value
 * For example: path rule.validation.delay = 300
 * sets value rule{validation {delay=300}}
 *
 ***********************************************************************************/
def setNestedProperty(obj, path, value) {
	def parts = path.split(/\./)
	def target = obj
	parts[0..-2].each { p ->
		// Для контейнеров типа violationRules { rule { ... } }
		if (target.metaClass.respondsTo(target, p)) {
			target = target."$p" {}
		} else {
			target = target."$p"
		}
	}
	target."${parts[-1]}" = value
}

/************************************************************************************
 *
 * Set nested property value from  TOML
 * where root path is config prefix
 * for excample jacoco-configuration.rule.validation.delay = 300
 * removes jacoco from the path
 * 
 * Note: Standard TOML does not support free formated sections. The non standard TOML file should be created and loaded
 *     import com.moandjiezana.toml.Toml
 *     def jacocoConfig = new Toml().read(file("gradle/jacoco-config.toml"))
 ***********************************************************************************/
def applyConfigFromToml(obj, configMap, prefix) {
	configMap.getKeys().findAll { it.startsWith(prefix) }.each { fullKey ->
		def shortKey = fullKey.substring(prefix.length() + 1) // убираем префикс и точку
		def val = configMap.get(fullKey)
		setNestedProperty(obj, shortKey, val instanceof String && val.isNumber() ? val.toBigDecimal() : val)
	}
}

/************************************************************************************
 *
 * Set nested property value from  proeprties file
 * where root path is config prefix
 * for excample jacoco-configuration.rule.validation.delay = 300
 * removes jacoco from the path
 *
 ***********************************************************************************/
def applyConfigFromProperties(obj, props, prefix) {
	props.stringPropertyNames()
		 .findAll { it.startsWith(prefix + ".") }
		 .each { fullKey ->
			 def shortKey = fullKey.substring(prefix.length() + 1)
			 def rawVal = props.getProperty(fullKey)
			 def val = rawVal.isInteger() ? rawVal.toInteger() :
					   rawVal.isBigDecimal() ? rawVal.toBigDecimal() :
					   rawVal.equalsIgnoreCase("true") || rawVal.equalsIgnoreCase("false") ? rawVal.toBoolean() :
					   rawVal
		 }
}
