/**
 *  Jacoco report for all subprojects
 */
tasks.register("jacocoRootReport", JacocoReport) {
	group = "verification"
    description = "Merged JaCoCo report for all subprojects"
    doLast {
        reports.all { report ->
            def file = report.outputLocation.get().asFile
            if (file.exists()) {
                println "JaCoCo merged report created: ${file.absolutePath}"
            }
        }
    }
}
/**************************************************************************************
 *  Merge Jacoco Report to one file
 *************************************************************************************/
gradle.projectsEvaluated {
	def reportTask = tasks.named("jacocoRootReport").get()

	reportTask.classDirectories.setFrom files(subprojects.collect { it.sourceSets.main.output })
	reportTask.sourceDirectories.setFrom files(subprojects.collect { it.sourceSets.main.allSource.srcDirs })
	reportTask.additionalSourceDirs.setFrom files(subprojects.collect { it.sourceSets.main.allSource.srcDirs })
	// collect executionData from each Test task in each subproject
       // collect execution data from each subproject's jacocoTestReport task
    def executionFiles = subprojects.collect { proj ->
        proj.tasks.withType(Test).findAll { it.enabled }.collect { testTask ->
            // every Test task automatically creates executionData when jacoco plugin applied
            def jacoco = proj.extensions.findByType(org.gradle.testing.jacoco.plugins.JacocoPluginExtension)
            def execFile = testTask.extensions.findByType(org.gradle.testing.jacoco.plugins.JacocoTaskExtension)?.destinationFile
            execFile
        }
    }.flatten().findAll { it != null }

    reportTask.executionData.setFrom files(executionFiles)
}

